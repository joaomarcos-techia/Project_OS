name: Convênios — provas sintéticas de banco

# Provas do módulo Convênios (TISS) em PostgreSQL DESCARTÁVEL criado dentro do próprio runner
# (initdb no diretório temporário; some com a máquina). Por que existe: o notebook de
# desenvolvimento não comporta Postgres nem build (decisão do fundador de 15/11/2026), e estas
# provas não estavam em nenhum job.
#
# Limites (decisão do fundador para testes em CI):
#   - dados 100% sintéticos, gerados pelos próprios harnesses; nenhum dado real do Qoro;
#   - nenhum segredo: o job não referencia `secrets.*` nem `vars.*`, e roda sem `.env.local`;
#   - nenhum banco compartilhado (DEV ou produção) e nenhuma migration fora do cluster descartável;
#   - nenhum deploy, nenhum artefato publicado (nem dump), nenhuma chamada a Asaas, AbacatePay,
#     operadora ou Supabase: o armazenamento dos arquivos é um mapa em memória do harness;
#   - token do GitHub só de leitura, e retirado do git antes de instalar dependências.
#
# A cadeia "na ordem do DEV" lê as migrations 0136–0142 e a 0159 candidata do #53 por `git show`
# de dois commits fixos (scripts/security/dev-order-chain.ts). Só leitura do repositório.

# `push` na branch do #55 (não `pull_request`): o filtro de caminhos olha só os commits enviados,
# então um push só de documentação não gasta minutos do Actions.
on:
  push:
    branches: [feat/convenios-tiss-20261110, integracao/composicao-64-55-20261126]
    paths:
      - 'src/contexts/health-insurance/**'
      - 'src/lib/premium-access/**'
      - 'scripts/security/health-insurance-*-db.ts'
      - 'scripts/security/hi-fixtures.ts'
      - 'src/lib/outbox/**'
      - 'scripts/security/outbox-budget-db.ts'
      - 'scripts/security/outbox-shared-cron-db.ts'
      - 'scripts/security/scratch-schema.ts'
      - 'scripts/security/dev-order-chain.ts'
      - 'scripts/security/hi-0167-apply-rehearsal.ts'
      - 'scripts/security/migration-composition-io.ts'
      - 'drizzle/migrations/**'
      - 'docs/convenios/migrations/**'
      - '.github/workflows/convenios-synthetic-db.yml'
      # Harnesses de S2–S8 e da P11 (e o código que eles provam): sem eles aqui, um push que só
      # mexe num desses arquivos passava sem a rodada sintética (visto em 28/11, e45217c4).
      - 'scripts/security/agent-insurance-*-db.ts'
      - 'scripts/security/audit-*-db.ts'
      - 'scripts/security/auth-password-history-db.ts'
      - 'scripts/security/login-attempts-retention-db.ts'
      - 'scripts/security/migration-final-order-db.ts'
      - 'src/contexts/ai-agent/**'
      - 'src/lib/db/audit-anchor*.ts'
      - 'scripts/security/audit-anchor*.ts'
      - 'src/lib/auth/**'

permissions:
  contents: read

concurrency:
  group: convenios-synthetic-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-db:
    name: Convênios — Postgres descartável (sintético)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # O commit enviado, exatamente como está (a cadeia do DEV é a do #55, sem merge com a main).
      - uses: actions/checkout@v4

      - name: Commits do #53, do #64 (0168) e do #59 (trilha da plataforma) lidos pelas cadeias (só leitura) e retirada do token do git
        run: |
          git fetch --no-tags --depth=1 origin \
            8c591c8f3d89b459a80c30bb36541eae1123861f \
            97e2c3067ad35ce487a426d966949f7391c37870 \
            74823d649d8a9aa6f8842bf6cbfb9f953d0470f2 \
            c6e91bf1991fcabe2f30aa67b20914e0ab625a64
          git config --local --unset-all http.https://github.com/.extraheader || true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 0162 — matriz de permissões I.2, arquivo final do journal (12 provas)
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55549 \
            pnpm exec tsx scripts/security/health-insurance-permission-matrix-db.ts

      # P1.12-b (matriz I.2): escopo "só as próprias" e valores fora do servidor nas leituras da interface.
      - name: Matriz I.2 — escopo das guias e valores nas leituras (D-1, D-3, D-4)
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55553 NODE_OPTIONS=--conditions=react-server \
            pnpm exec tsx scripts/security/health-insurance-guide-scope-db.ts

      # P7.5 (0165): cancelamento na operadora e substituição só com recibo; cancelaGuia no XSD oficial.
      - name: 0165 — cancelamento na operadora e substituição só com recibo (P7.5)
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55554 NODE_OPTIONS=--conditions=react-server \
            pnpm exec tsx scripts/security/health-insurance-guide-cancellation-db.ts

      # P6.6/P12.6: manutenção de Convênios do fim do financial-reconcile (vencimento e resumo diário).
      - name: Manutenção de Convênios — vencimento das autorizações e resumo diário (P6.6/P12.6)
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55555 NODE_OPTIONS=--conditions=react-server \
            pnpm exec tsx scripts/security/health-insurance-maintenance-db.ts

      # P6.3: comprovante da autorização em partes (até 10 MB), cifra real, leitura auditada e conferência de órfãos.
      - name: Comprovante da autorização em partes (P6.3)
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55556 NODE_OPTIONS=--conditions=react-server \
            pnpm exec tsx scripts/security/health-insurance-receipt-upload-db.ts

      - name: Avisos de autorização entregues à clínica (P6.6, 0166)
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55557 NODE_OPTIONS=--conditions=react-server \
            pnpm exec tsx scripts/security/health-insurance-authorization-alerts-db.ts

      - name: Concorrência da manutenção de Convênios (execuções sobrepostas, linha presa, conexão derrubada)
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55558 NODE_OPTIONS=--conditions=react-server \
            pnpm exec tsx scripts/security/health-insurance-maintenance-concurrency-db.ts

      - name: Interruptor do módulo pela plataforma (P1.13, contrato do console)
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55559 NODE_OPTIONS=--conditions=react-server \
            pnpm exec tsx scripts/security/health-insurance-platform-db.ts

      - name: Relatório por operadora e período (P9.10, somas contra o livro)
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55560 NODE_OPTIONS=--conditions=react-server \
            pnpm exec tsx scripts/security/health-insurance-report-db.ts

      - name: Estados da cobertura não bloqueiam o atendimento clínico (P5.1)
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55561           NODE_OPTIONS="--import ./scripts/security/server-only-hook.mjs"             ./node_modules/.bin/tsx --tsconfig tsconfig.scripts.json scripts/security/health-insurance-coverage-states-db.ts

      - name: Série recorrente de convênio e consumo da autorização (P4.7)
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55562           NODE_OPTIONS="--import ./scripts/security/server-only-hook.mjs"             ./node_modules/.bin/tsx --tsconfig tsconfig.scripts.json scripts/security/health-insurance-series-authorization-db.ts

      - name: Credenciais da operadora e leitura só para o envio SOAP (P2.5, P6.5, P12.5)
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55563           NODE_OPTIONS="--import ./scripts/security/server-only-hook.mjs"             ./node_modules/.bin/tsx --tsconfig tsconfig.scripts.json scripts/security/health-insurance-insurer-credentials-db.ts

      - name: Envio do lote pelo conector homologado contra a operadora stub (P9.4, teto "Testado")
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55566           NODE_OPTIONS="--import ./scripts/security/server-only-hook.mjs"             ./node_modules/.bin/tsx --tsconfig tsconfig.scripts.json scripts/security/health-insurance-batch-connector-db.ts

      - name: Worker do outbox — prazo de reserva e descarte em bloco (R61, 6 provas)
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55567           NODE_OPTIONS="--import ./scripts/security/server-only-hook.mjs"             ./node_modules/.bin/tsx --tsconfig tsconfig.scripts.json scripts/security/outbox-budget-db.ts

      # R61-B: a invocação compartilhada da rota do cron (outbox + 4 tarefas financeiras com os prazos da
      # AbacatePay), com corte REAL da função aos 60 s (processo filho morto) e recuperação pelo janitor.
      - name: Invocação compartilhada do cron (R61-B, 6 provas, corte real aos 60 s)
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55568 NODE_OPTIONS="--import ./scripts/security/server-only-hook.mjs" \
            ./node_modules/.bin/tsx --tsconfig tsconfig.scripts.json scripts/security/outbox-shared-cron-db.ts

      # P8.4: itens executados adicionais da sessão SP/SADT, com a candidata 0167 depois da cadeia do DEV.
      - name: "Itens executados adicionais (P8.4, política P8.4-r aprovada, 0167; 28 provas)"
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55569 NODE_OPTIONS="--import ./scripts/security/server-only-hook.mjs"             ./node_modules/.bin/tsx --tsconfig tsconfig.scripts.json scripts/security/health-insurance-extra-items-db.ts

      # Guia nova depois de uma guia cancelada antes do envio (defeito de 24/11): identidade própria, uma por cancelamento.
      - name: "Guia nova depois de cancelada (SP/SADT e Consulta; 14 provas)"
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55571 NODE_OPTIONS="--import ./scripts/security/server-only-hook.mjs"             ./node_modules/.bin/tsx --tsconfig tsconfig.scripts.json scripts/security/health-insurance-guide-reissue-db.ts

      - name: "Ensaio da aplicação da 0167 com o migrador real (lock, reaplicação, reversão; 11 provas)"
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55570 NODE_OPTIONS="--import ./scripts/security/server-only-hook.mjs"             ./node_modules/.bin/tsx --tsconfig tsconfig.scripts.json scripts/security/hi-0167-apply-rehearsal.ts

      - name: Desempenho da H.2 com o código real (P14.4; metas e desvio registrado)
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55564           NODE_OPTIONS="--import ./scripts/security/server-only-hook.mjs"             ./node_modules/.bin/tsx --tsconfig tsconfig.scripts.json scripts/security/health-insurance-performance-db.ts

      # Cada prova roda mesmo se a anterior falhar (evidência independente); o job falha se qualquer uma falhar.
      - name: SP/SADT — solicitação, automação e indicação clínica × D24
        if: ${{ !cancelled() }}
        # tsx direto: o `--import` em NODE_OPTIONS também valeria para o próprio pnpm e quebra o
        # carregamento dele (visto na execução 43774430786).
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" \
          NODE_OPTIONS="--import ./scripts/security/server-only-hook.mjs" \
            ./node_modules/.bin/tsx --tsconfig tsconfig.scripts.json scripts/security/health-insurance-sadt-db.ts

      - name: Repasse do convênio — cancelamento com repasse e revisão humana (0163)
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" NODE_OPTIONS=--conditions=react-server \
            pnpm exec tsx scripts/security/health-insurance-payout-db.ts

      - name: Interruptor do módulo — classe A recusada, classe C preservada
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55551 NODE_OPTIONS=--conditions=react-server \
            pnpm exec tsx scripts/security/health-insurance-module-switch-db.ts

      # 0164 (arquivo final do journal, autorizada para o DEV em 16/11): o interruptor também nos gatilhos do banco.
      - name: 0164 — gatilhos do módulo, classe A barrada no banco, preservação e recuperação passam
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55552 NODE_OPTIONS=--conditions=react-server \
            pnpm exec tsx scripts/security/health-insurance-module-switch-triggers-db.ts

      # Ciclo de 26/11 (candidatas fora do journal + P0): mesmas provas da bateria local, agora no runner Linux.
      - name: P0 Marco Civil — login_attempts por 186 dias (rota real do cron) e R42
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55607 NODE_OPTIONS=--conditions=react-server \
            pnpm exec tsx scripts/security/login-attempts-retention-db.ts

      - name: Candidata 0169 — importação histórica com convênio sem guia nem cobrança (P4.7-b)
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55608 NODE_OPTIONS=--conditions=react-server \
            pnpm exec tsx scripts/security/health-insurance-historical-import-db.ts

      - name: Candidata 0170 — histórico de verificadores de senha (S4)
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55609 NODE_OPTIONS=--conditions=react-server \
            pnpm exec tsx scripts/security/auth-password-history-db.ts

      - name: Candidata 0171 — trilhas da clínica append-only (S5, padrão ADR-075)
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55612 NODE_OPTIONS=--conditions=react-server \
            pnpm exec tsx scripts/security/audit-trails-append-only-db.ts

      - name: S5 — ancoragem das duas trilhas por hash encadeado (8 provas, inclusive partição apagada)
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55643 NODE_OPTIONS=--conditions=react-server \
            pnpm exec tsx scripts/security/audit-anchor-db.ts

      # Sem Postgres e sem rede externa: duas TSAs locais (OpenSSL do runner) no loopback.
      - name: "S5 — selo das âncoras por carimbo de tempo RFC 3161 (8 provas: adulteração, forja, TSA fora, recuperação)"
        if: ${{ !cancelled() }}
        run: pnpm exec tsx scripts/security/audit-anchor-seal-tsa.ts

      - name: Ordem final das migrations — DEV + 0168 (#64) + 0169–0171 + 0172 (#59), um verificador nas duas trilhas
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55631 NODE_OPTIONS=--conditions=react-server PR64_REF=74823d649d8a9aa6f8842bf6cbfb9f953d0470f2 PR59_REF=c6e91bf1991fcabe2f30aa67b20914e0ab625a64 \
            pnpm exec tsx scripts/security/migration-final-order-db.ts

      - name: "P11 — jornadas de Convênios do agente de IA, lado do Convênios (8 provas)"
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55641 NODE_OPTIONS=--conditions=react-server \
            pnpm exec tsx scripts/security/agent-insurance-journeys-db.ts

      - name: "P11.1 — ferramentas reais do agente com Convênios, ponta a ponta no banco (10 provas)"
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55642 NODE_OPTIONS=--conditions=react-server \
            pnpm exec tsx scripts/security/agent-insurance-tools-db.ts

      - name: "P11.2 — as cinco jornadas do agente com Convênios pela conversa, turno real no banco (6 provas)"
        if: ${{ !cancelled() }}
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" PORT=55644 NODE_OPTIONS=--conditions=react-server \
            pnpm exec tsx scripts/security/agent-insurance-conversation-db.ts
