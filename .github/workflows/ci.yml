name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Arch check (madge — circular deps)
        run: pnpm arch:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          # C1+ env.ts validates these via Zod at module load (loaded by next.config.ts).
          # Fake values satisfy validation; build does not connect to DB or Supabase.
          # Same approach used by vitest.config.ts. To run against real Supabase in CI,
          # replace with GitHub Secrets references (e.g. ${{ secrets.DATABASE_URL }}).
          DATABASE_URL: 'postgres://ci:ci@localhost:5432/ci?sslmode=require'
          NEXT_PUBLIC_SUPABASE_URL: 'https://ci.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_ci'
