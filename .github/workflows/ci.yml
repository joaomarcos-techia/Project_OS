name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    # Build frio local comprovado pode exceder 10 min só na compilação; este
    # limite não muda nenhum gate, apenas evita cancelar uma execução saudável.
    timeout-minutes: 30  # composição descartável: 9.001 testes passam dos 20 min do job (só nesta branch)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          # Alinhado ao runtime: package.json engines.node = 22.x (achado A3).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # V14 (auditoria de segurança): gate de dependências de PRODUÇÃO. Falha em
      # HIGH+ nas deps que sobem para produção (dev-tooling não conta, por isso
      # --prod). pnpm-workspace.yaml fixa apenas as versões corrigidas necessárias
      # à compatibilidade da stack; não há auditConfig, ignoreGhsas ou exceção.
      - name: Prod dependency audit gate (high+)
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        # O tsc do projeto inteiro passou do teto padrão do Node (~2 GB) no runner (OOM em 18/11, com
        # "Reached heap limit" aos 2.028 MB). Só o teto de memória do processo muda; a checagem é a mesma.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Arch check (madge — circular deps)
        run: pnpm arch:check

      # F-07 (auditoria 2026-06-10): a metade AST do tooling de isolamento
      # multi-tenant ("enforced by tooling, not convention") rodava só manualmente.
      # arch:db-check cobre import dinâmico/require/re-export transitivo que o
      # ESLint não cobre; check:migrations é o gate fail-closed anti-DROP;
      # check:registry:strict garante catalog ⇔ registry (com allowlist
      # producer-ahead — F-14).
      - name: Arch DB check (AST connection-origin guard)
        run: pnpm arch:db-check

      - name: Migration safety gate (anti-destructive)
        run: pnpm check:migrations

      # M5/N1 — a doc operacional é a fonte de verdade DURANTE incidente, e
      # nenhum gate a conferia contra o código. Resultado: runbook dizendo "6
      # crons" com 13 no manifesto, e uma saved-search alertando sobre um evento
      # que nada emitia (busca vazia é indistinguível de "está tudo bem").
      - name: Observability drift gate (docs ⇔ vercel.json ⇔ eventos)
        run: pnpm check:observability

      - name: Handler registry gate (catalog ⇔ registry)
        run: pnpm check:registry:strict
        env:
          # check:registry importa o boot file de handlers → módulos que carregam
          # src/lib/env.ts (Zod no module load). Mesmos fakes do step Build.
          DATABASE_URL: 'postgres://ci:ci@localhost:5432/ci?sslmode=require'
          NEXT_PUBLIC_SUPABASE_URL: 'https://ci.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_ci'

      - name: Test + coverage gate
        run: pnpm test:coverage

      - name: Security inventory (AST and explicit guard review)
        run: pnpm security:inventory

      - name: Two-tenant isolation (temporary local Postgres)
        run: SECURITY_PG_BIN="$(pg_config --bindir)" pnpm security:tenant

      - name: Convênios — isolamento de todas as tabelas do módulo (temporary local Postgres, P12.1)
        run: SECURITY_PG_BIN="$(pg_config --bindir)" TENANT_ISOLATION_CHAIN=local pnpm security:tenant:convenios

      - name: Build
        run: pnpm security:build
        env:
          NODE_ENV: production
          # C1+ env.ts validates these via Zod at module load (loaded by next.config.ts).
          # Fake values satisfy validation; build does not connect to DB or Supabase.
          # Same approach used by vitest.config.ts. To run against real Supabase in CI,
          # replace with GitHub Secrets references (e.g. ${{ secrets.DATABASE_URL }}).
          DATABASE_URL: 'postgres://ci:ci@localhost:5432/ci?sslmode=require'
          NEXT_PUBLIC_SUPABASE_URL: 'https://ci.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_ci'

      - name: Client bundle secrets and local HTTP boundaries
        run: pnpm security:bundle && pnpm security:http

      # Auditoria E2E (2026-09-13): a suíte tinha 51 specs e ~20.000 linhas, e
      # NENHUMA rodava aqui — 40 exigem variável de autorização própria,
      # credenciais de clínica sintética e conexão ao Postgres de PRODUÇÃO. Boa
      # ferramenta de auditoria, zero proteção contra regressão antes do merge.
      #
      # Este passo roda a fatia que dispensa segredo (fronteira sem sessão,
      # cabeçalhos de segurança, integridade do form de login) contra o MESMO
      # build isolado que o passo acima já produziu. Ver
      # docs/quality/e2e-coverage-audit.md.
      - name: Install Playwright browser (chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E gate (superfície pública, sem credencial)
        run: pnpm test:e2e:ci

      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
