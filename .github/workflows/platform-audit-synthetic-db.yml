name: Trilha da plataforma — prova sintética de banco

# Prova da candidata docs/security/migrations/0163_super_admin_actions_append_only.candidate.sql
# (super_admin_actions append-only) em PostgreSQL DESCARTÁVEL criado dentro do próprio runner
# (initdb no diretório temporário; some com a máquina). Existe porque o notebook de
# desenvolvimento não roda Postgres (decisão do fundador de 15/11/2026). Mesmo modelo de
# .github/workflows/convenios-synthetic-db.yml, do #55.
#
# Limites:
#   - dados 100% sintéticos, gerados pelo harness; nenhum dado real do Qoro;
#   - nenhum segredo: o job não referencia `secrets.*` nem `vars.*` e roda sem `.env.local`;
#   - nenhum banco compartilhado (DEV ou produção): a candidata só toca o cluster descartável;
#   - nenhum deploy, nenhum artefato publicado, nenhuma chamada externa;
#   - token do GitHub só de leitura e fora do git (`persist-credentials: false`).

# `push` só nesta branch, com filtro de caminhos: um push só de documentação não gasta minutos.
on:
  push:
    branches: [claude/trilha-plataforma-append-only]
    paths:
      - 'docs/security/migrations/**'
      - 'scripts/security/super-admin-actions-append-only-db.ts'
      - 'scripts/security/scratch-schema.ts'
      - 'drizzle/migrations/**'
      - '.github/workflows/platform-audit-synthetic-db.yml'

permissions:
  contents: read

concurrency:
  group: platform-audit-synthetic-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-db:
    name: Trilha da plataforma — Postgres descartável (sintético)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsx direto (não `pnpm <script>`): a porta vai no argv, sem variável de ambiente nova.
      - name: Candidata 0163 — trilha append-only (10 provas)
        run: |
          SECURITY_PG_BIN="$(pg_config --bindir)" \
            ./node_modules/.bin/tsx scripts/security/super-admin-actions-append-only-db.ts 55561
