name: Daily DB Backup (prod)

# Backup diário do banco de PRODUÇÃO (C16 / DR): um pg_dump/dia
# cifrado (AES-256) guardado como artifact. O RPO efetivo depende da última
# execução bem-sucedida; este arquivo não substitui PITR nem backup de objetos Storage.
#
# Secrets necessários (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL_PROD  -> connection string de prod (com ?sslmode=require)
#   BACKUP_PASSPHRASE  -> senha forte p/ cifrar o dump (guarde no seu cofre)
#
# Restaurar depois: baixe o artifact e siga docs/runbooks/disaster-recovery.md.
# Não grave o SQL decifrado em disco sem proteção.

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC diário
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Instalar postgresql-client 17 (PGDG)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump + cifrar
        env:
          DATABASE_URL_PROD: ${{ secrets.DATABASE_URL_PROD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL_PROD" || { echo "::error::DATABASE_URL_PROD secret ausente"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "::error::BACKUP_PASSPHRASE secret ausente"; exit 1; }
          # Session Pooler (5432) — Transaction Pooler (6543) pode cair no meio de um dump longo.
          URL="${DATABASE_URL_PROD/:6543\//:5432\/}"
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          OUT="prod-${TS}.sql.gpg"
          # pg_dump precisa ser >= a versao do servidor (Supabase = PG17). O wrapper
          # do Ubuntu resolve pra 16 mesmo com o 17 instalado, entao chamamos o binario 17 direto.
          PGDUMP=/usr/lib/postgresql/17/bin/pg_dump
          "$PGDUMP" --version
          # Auth e public precisam do mesmo snapshot: public referencia auth.users.
          # O SQL segue por pipe para GPG; nunca existe arquivo em claro no runner.
          {
            printf '%s\n' "$BACKUP_PASSPHRASE"
            "$PGDUMP" --no-owner --no-acl --clean --if-exists \
              --exclude-schema=storage --exclude-schema=realtime \
              --exclude-schema=extensions --exclude-schema=graphql --exclude-schema=graphql_public \
              --exclude-schema=vault --exclude-schema=supabase_functions --exclude-schema=_realtime \
              --exclude-schema=_analytics --exclude-schema=pgsodium --exclude-schema=pgsodium_masks \
              --exclude-schema=pgbouncer --format=plain "$URL"
          } | gpg --batch --quiet --no-tty --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "$OUT"
          test -s "$OUT" || { echo "::error::backup cifrado vazio"; exit 1; }
          printf '%s\n' "$BACKUP_PASSPHRASE" | gpg --batch --quiet --no-tty \
            --pinentry-mode loopback --passphrase-fd 0 --decrypt "$OUT" \
            | tail -n 5 | grep -q 'PostgreSQL database dump complete'
          echo "backup cifrado: $(wc -c < "$OUT") bytes"

      - name: Upload do backup cifrado
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: 'prod-*.sql.gpg'
          retention-days: 30
          if-no-files-found: error
