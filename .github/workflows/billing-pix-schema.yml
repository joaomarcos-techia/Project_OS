name: Billing Pix schema qualification

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/billing-pix-schema.yml
      - scripts/abacatepay-pix-release.ts
      - scripts/security/abacatepay-pix-release-db.ts
      - docs/decoupling/asaas-to-abacatepay/migrations/**

permissions:
  contents: read

jobs:
  schema:
    if: github.event.pull_request.number == 68 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rehearse Production 160 to 169 with synthetic data
        run: SECURITY_PG_BIN="$(pg_config --bindir)" node --conditions=react-server --import tsx scripts/security/abacatepay-pix-release-db.ts
