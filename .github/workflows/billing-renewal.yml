name: Billing renewal — isolated financial qualification

on:
  push:
    branches: [feat/billing-abacatepay-20261107]
    paths:
      - .github/workflows/billing-renewal.yml
      - scripts/security/abacatepay-renewal-db.ts
      - scripts/security/abacatepay-operational-proof.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: billing-renewal-synthetic
  cancel-in-progress: false

jobs:
  qualification:
    if: github.repository == 'joaomarcos-techia/Project_OS' && github.ref == 'refs/heads/feat/billing-abacatepay-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record exact source and runner; no repository secrets
        run: |
          mkdir -p dist/renewal-qualification
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          writeFileSync('dist/renewal-qualification/source.json', JSON.stringify({
            startedAt: new Date().toISOString(),
            sha: git('rev-parse', 'HEAD'),
            applicationTree: git('rev-parse', 'HEAD:src'),
            migrationTree: git('rev-parse', 'HEAD:drizzle'),
            node: process.version,
            pnpm: execFileSync('pnpm', ['--version'], { encoding: 'utf8' }).trim(),
            environment: 'disposable_loopback_synthetic',
            repositorySecretsProvided: false,
            sharedDatabaseWrites: 0,
            providerMutations: 0
          }, null, 2));
          NODE
      - name: Renewal, invoices, calendar, plans, replay and tenant isolation
        run: |
          export SECURITY_PG_BIN="$(pg_config --bindir)"
          node --conditions=react-server --import tsx scripts/security/abacatepay-renewal-db.ts
          cp dist/abacatepay-renewal-db.json dist/renewal-qualification/
      - name: Actual HTTP receiver, Redis leases, worker, outages and recovery
        env:
          QORO_ABACATEPAY_OPERATIONAL: '1'
          QORO_ABACATEPAY_OPERATIONAL_PROFILE: pilot
        run: |
          export SECURITY_PG_BIN="$(pg_config --bindir)"
          node --conditions=react-server --import tsx scripts/security/abacatepay-renewal-db.ts
          cp dist/abacatepay-pilot-http.json dist/renewal-qualification/
      - name: Trial provisioning, verified payment and operational module gates
        run: |
          export SECURITY_PG_BIN="$(pg_config --bindir)"
          node --conditions=react-server --import tsx scripts/security/signup-free-trial-db.ts --shared-schema
          cp dist/signup-free-trial-db.json dist/renewal-qualification/
      - name: Nine trial limits, payment release and permanent plan capacity
        run: |
          export SECURITY_PG_BIN="$(pg_config --bindir)"
          node --conditions=react-server --import tsx scripts/security/trial-resource-limits.ts
          cp dist/trial-resource-limits.json dist/renewal-qualification/
      - name: Checkout concurrency, ambiguous responses and payment recovery
        run: |
          export SECURITY_PG_BIN="$(pg_config --bindir)"
          node --conditions=react-server --import tsx scripts/security/abacatepay-checkout-recovery-db.ts
          cp dist/abacatepay-checkout-recovery-db.json dist/renewal-qualification/
      - name: Legacy cancellation with the candidate schema
        run: |
          export SECURITY_PG_BIN="$(pg_config --bindir)"
          node --conditions=react-server --import tsx scripts/security/legacy-cancellation-db.ts candidate-160
          cp dist/cancellation-candidate-160.json dist/renewal-qualification/
      - name: Preserve synthetic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billing-renewal-${{ github.sha }}
          path: |
            dist/renewal-qualification/*.json
            dist/abacatepay-renewal-db.json
            dist/abacatepay-operational*.json
            dist/abacatepay-pilot-http.json
            dist/signup-free-trial-db.json
            dist/trial-resource-limits.json
            dist/abacatepay-checkout-recovery-db.json
            dist/cancellation-candidate-160.json
          retention-days: 7
          if-no-files-found: error
